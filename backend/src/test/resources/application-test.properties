spring.datasource.url=jdbc:h2:mem:flowforge-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.task.scheduling.enabled=false
flowforge.jwt.private-key-path=
flowforge.jwt.public-key-path=
flowforge.jwt.issuer=https://auth.flowforge.test
flowforge.jwt.audience=flowforge-test-api
flowforge.jwt.key-id=flowforge-test-1
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
flowforge.wso2.enabled=false
flowforge.wso2.insecure-tls=false