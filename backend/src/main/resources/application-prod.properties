spring.config.activate.on-profile=prod

# Production values are required and must be supplied by the deployment environment.
spring.datasource.url=${FLOWFORGE_DB_URL}
spring.datasource.username=${FLOWFORGE_DB_USERNAME}
spring.datasource.password=${FLOWFORGE_DB_PASSWORD}
spring.jpa.show-sql=false

flowforge.jwt.secret=${FLOWFORGE_JWT_SECRET}
flowforge.jwt.expiration-ms=${FLOWFORGE_JWT_EXPIRATION_MS:3600000}

spring.rabbitmq.host=${FLOWFORGE_RABBITMQ_HOST}
spring.rabbitmq.port=${FLOWFORGE_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${FLOWFORGE_RABBITMQ_USERNAME}
spring.rabbitmq.password=${FLOWFORGE_RABBITMQ_PASSWORD}

spring.data.redis.host=${FLOWFORGE_REDIS_HOST}
spring.data.redis.port=${FLOWFORGE_REDIS_PORT:6379}

management.endpoint.health.show-details=never