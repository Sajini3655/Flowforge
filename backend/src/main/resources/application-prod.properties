spring.config.activate.on-profile=prod

# Production values are required and must be supplied by the deployment environment.
spring.datasource.url=${FLOWFORGE_DB_URL}
spring.datasource.username=${FLOWFORGE_DB_USERNAME}
spring.datasource.password=${FLOWFORGE_DB_PASSWORD}
spring.jpa.show-sql=false

flowforge.jwt.private-key-path=${FLOWFORGE_JWT_PRIVATE_KEY_PATH:/run/secrets/flowforge-private.pem}
flowforge.jwt.public-key-path=${FLOWFORGE_JWT_PUBLIC_KEY_PATH:/run/secrets/flowforge-public.pem}
flowforge.jwt.expiration-ms=${FLOWFORGE_JWT_EXPIRATION_MS:3600000}
flowforge.jwt.issuer=${FLOWFORGE_JWT_ISSUER:https://auth.flowforge.local}
flowforge.jwt.audience=${FLOWFORGE_JWT_AUDIENCE:flowforge-api}
flowforge.jwt.key-id=${FLOWFORGE_JWT_KEY_ID:flowforge-prod-1}

spring.rabbitmq.host=${FLOWFORGE_RABBITMQ_HOST}
spring.rabbitmq.port=${FLOWFORGE_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${FLOWFORGE_RABBITMQ_USERNAME}
spring.rabbitmq.password=${FLOWFORGE_RABBITMQ_PASSWORD}

spring.data.redis.host=${FLOWFORGE_REDIS_HOST}
spring.data.redis.port=${FLOWFORGE_REDIS_PORT:6379}

management.endpoint.health.show-details=never
flowforge.security.cors.allowed-origins=${FLOWFORGE_CORS_ALLOWED_ORIGINS:https://flowforge.local}