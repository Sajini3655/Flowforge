spring.config.activate.on-profile=local

# Local development defaults intentionally match the Docker Compose services.
# These values are used when running the backend directly on the host machine.
spring.datasource.url=${FLOWFORGE_DB_URL:jdbc:postgresql://localhost:5433/flowforge}
spring.datasource.username=${FLOWFORGE_DB_USERNAME:flowforge}
spring.datasource.password=${FLOWFORGE_DB_PASSWORD:flowforge}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.url=${FLOWFORGE_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${FLOWFORGE_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${FLOWFORGE_FLYWAY_PASSWORD:${spring.datasource.password}}

spring.rabbitmq.host=${FLOWFORGE_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${FLOWFORGE_RABBITMQ_PORT:5673}
spring.rabbitmq.username=${FLOWFORGE_RABBITMQ_USERNAME:flowforge}
spring.rabbitmq.password=${FLOWFORGE_RABBITMQ_PASSWORD:flowforge}

spring.data.redis.host=${FLOWFORGE_REDIS_HOST:localhost}
spring.data.redis.port=${FLOWFORGE_REDIS_PORT:6379}

management.endpoint.health.show-details=never
