spring.application.name=flowforge-backend
spring.profiles.default=local

# PostgreSQL (Default: local host development connecting to Docker Compose services on port 5433)
spring.datasource.url=${FLOWFORGE_DB_URL:jdbc:postgresql://localhost:5433/flowforge}
spring.datasource.username=${FLOWFORGE_DB_USERNAME:flowforge}
spring.datasource.password=${FLOWFORGE_DB_PASSWORD:flowforge}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${FLOWFORGE_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT (provide externally generated RSA PEM files outside tests)
flowforge.jwt.private-key-path=${FLOWFORGE_JWT_PRIVATE_KEY_PATH:../infra/keys/flowforge-private.pem}
flowforge.jwt.public-key-path=${FLOWFORGE_JWT_PUBLIC_KEY_PATH:../infra/keys/flowforge-public.pem}
flowforge.jwt.expiration-ms=${FLOWFORGE_JWT_EXPIRATION_MS:3600000}
flowforge.jwt.issuer=${FLOWFORGE_JWT_ISSUER:https://auth.flowforge.local}
flowforge.jwt.audience=${FLOWFORGE_JWT_AUDIENCE:flowforge-api}
flowforge.jwt.key-id=${FLOWFORGE_JWT_KEY_ID:flowforge-dev-1}

# RabbitMQ (Default: local host development connecting to Docker Compose port 5673)
spring.rabbitmq.host=${FLOWFORGE_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${FLOWFORGE_RABBITMQ_PORT:5673}
spring.rabbitmq.username=${FLOWFORGE_RABBITMQ_USERNAME:flowforge}
spring.rabbitmq.password=${FLOWFORGE_RABBITMQ_PASSWORD:flowforge}

# Job reliability
flowforge.jobs.max-attempts=${FLOWFORGE_JOB_MAX_ATTEMPTS:3}
flowforge.jobs.retry-delay-ms=${FLOWFORGE_JOB_RETRY_DELAY_MS:5000}

# Redis coordination (Default: local host development connecting to Docker Compose port 6379)
spring.data.redis.host=${FLOWFORGE_REDIS_HOST:localhost}
spring.data.redis.port=${FLOWFORGE_REDIS_PORT:6379}
flowforge.job-lock.ttl-ms=${FLOWFORGE_JOB_LOCK_TTL_MS:60000}

# Flyway owns schema changes; inherits datasource credentials by default
spring.flyway.url=${FLOWFORGE_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${FLOWFORGE_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${FLOWFORGE_FLYWAY_PASSWORD:${spring.datasource.password}}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Outbox Pattern
flowforge.outbox.poll-interval-ms=${FLOWFORGE_OUTBOX_POLL_INTERVAL_MS:1000}
flowforge.outbox.batch-size=${FLOWFORGE_OUTBOX_BATCH_SIZE:10}

# Observability
management.endpoints.web.exposure.include=${FLOWFORGE_MANAGEMENT_ENDPOINTS:health,info,prometheus}
management.endpoint.health.probes.enabled=${FLOWFORGE_MANAGEMENT_HEALTH_PROBES_ENABLED:true}
management.endpoint.health.show-details=${FLOWFORGE_MANAGEMENT_HEALTH_DETAILS:never}
management.endpoint.health.group.readiness.include=readinessState,db,rabbit,redis
management.endpoint.health.group.liveness.include=livenessState
management.metrics.export.prometheus.enabled=${FLOWFORGE_MANAGEMENT_PROMETHEUS_ENABLED:true}
management.prometheus.metrics.export.enabled=${FLOWFORGE_MANAGEMENT_PROMETHEUS_ENABLED:true}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] [%thread] %logger{36} - %msg%n
