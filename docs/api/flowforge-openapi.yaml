openapi: 3.0.3
info:
  title: FlowForge API
  version: v1
  description: Business API for FlowForge job processing and API definition management.
servers:
  - url: http://localhost:8080/api
    description: Local Spring Boot backend
tags:
  - name: Jobs
    description: Asynchronous job submission and status
  - name: API definitions
    description: Managed API definition metadata
paths:
  /jobs:
    get:
      tags: [Jobs]
      summary: List jobs visible to the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Jobs visible to the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Jobs]
      summary: Submit a job
      description: An identical Idempotency-Key replay returns 200; a conflicting request returns 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '200':
          description: Existing job returned for an identical idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '201':
          description: Job created and queued
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get a job
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Job returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /apis:
    get:
      tags: [API definitions]
      summary: List API definitions visible to the current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: API definitions returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [API definitions]
      summary: Create an API definition
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiDefinitionRequest'
      responses:
        '201':
          description: API definition created
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /apis/{id}:
    get:
      tags: [API definitions]
      summary: Get an API definition
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: API definition returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer <token>'
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Correlation identifier echoed by the backend or generated when absent.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional user-scoped key for safe job submission replay. Maximum 128 characters.
      schema:
        type: string
        maxLength: 128
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  headers:
    CorrelationId:
      description: Correlation identifier echoed by the backend or generated when absent.
      schema:
        type: string
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication is required or the bearer token is invalid or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated user lacks the required role or resource access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Idempotency key conflicts with a different request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    JobRequest:
      type: object
      required: [type, requestPayload]
      properties:
        type:
          type: string
        requestPayload:
          type: string
    Job:
      type: object
      required: [id, type, requestPayload, status, attemptCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        requestPayload:
          type: string
        result:
          type: string
          nullable: true
        status:
          type: string
          enum: [QUEUED, PROCESSING, COMPLETED, FAILED]
        attemptCount:
          type: integer
          format: int32
        idempotencyKey:
          type: string
          nullable: true
          maxLength: 128
        requestFingerprint:
          type: string
          nullable: true
          maxLength: 64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiDefinitionRequest:
      type: object
      required: [name, version, basePath, backendUrl]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: string
        basePath:
          type: string
        backendUrl:
          type: string
    ApiDefinition:
      type: object
      required: [id, name, version, basePath, backendUrl, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: string
        basePath:
          type: string
        backendUrl:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, DEPRECATED]
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [message]
      properties:
        message:
          type: string