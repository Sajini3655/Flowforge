global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  - job_name: 'flowforge-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:8080']
        labels:
          application: 'flowforge'
          service: 'backend'
          environment: 'local'

  - job_name: 'prometheus'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
