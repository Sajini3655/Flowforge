name: FlowForge CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: mvn -B -ntp clean test
      - name: Package backend
        run: mvn -B -ntp package -DskipTests
      - name: Generate Maven SBOM
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DskipTests
      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowforge-backend-artifacts
          path: |
            backend/target/*.jar
            backend/target/bom.json
            backend/target/bom.xml

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend integration tests
        run: mvn -B -ntp -Pintegration verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowforge-frontend-dist
          path: frontend/dist

  container:
    runs-on: ubuntu-latest
    needs: [backend, backend-integration, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag flowforge-backend:${{ github.sha }} ./backend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flowforge-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Validate Compose file
        run: docker compose config
