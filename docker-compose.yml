services:
  postgres:
    image: postgres:16
    container_name: flowforge-postgres
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
    ports:
      - "5432:5432"
      - "5433:5432"
    volumes:
      - flowforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: flowforge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: flowforge
      RABBITMQ_DEFAULT_PASS: flowforge
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - flowforge-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 30s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: flowforge-redis
    ports:
      - "6379:6379"
    volumes:
      - flowforge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      FLOWFORGE_DB_URL: jdbc:postgresql://postgres:5432/flowforge
      FLOWFORGE_DB_USERNAME: flowforge
      FLOWFORGE_DB_PASSWORD: ${FLOWFORGE_DB_PASSWORD:-flowforge}
      FLOWFORGE_JPA_SHOW_SQL: "false"
      FLOWFORGE_JWT_PRIVATE_KEY_PATH: /run/secrets/flowforge-private.pem
      FLOWFORGE_JWT_PUBLIC_KEY_PATH: /run/secrets/flowforge-public.pem
      FLOWFORGE_JWT_ISSUER: ${FLOWFORGE_JWT_ISSUER:-https://auth.flowforge.local}
      FLOWFORGE_JWT_AUDIENCE: ${FLOWFORGE_JWT_AUDIENCE:-flowforge-api}
      FLOWFORGE_JWT_KEY_ID: ${FLOWFORGE_JWT_KEY_ID:-flowforge-dev-1}
      FLOWFORGE_RABBITMQ_HOST: rabbitmq
      FLOWFORGE_RABBITMQ_PORT: 5672
      FLOWFORGE_RABBITMQ_USERNAME: flowforge
      FLOWFORGE_RABBITMQ_PASSWORD: ${FLOWFORGE_RABBITMQ_PASSWORD:-flowforge}
      FLOWFORGE_REDIS_HOST: redis
      FLOWFORGE_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    volumes:
      - ./infra/keys:/run/secrets:ro

  wso2-apim:
    profiles: ["wso2"]
    build:
      context: ./infra/wso2
      dockerfile: Dockerfile
    image: flowforge-wso2:4.7.0-custom
    environment:
      FLOWFORGE_JWKS_URL: http://backend:8080/api/.well-known/jwks.json
      FLOWFORGE_JWT_ISSUER: ${FLOWFORGE_JWT_ISSUER:-https://auth.flowforge.local}
      FLOWFORGE_JWT_AUDIENCE: ${FLOWFORGE_JWT_AUDIENCE:-flowforge-api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8243:8243"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9763/services/Version"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: flowforge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - flowforge-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.0
    container_name: flowforge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - flowforge-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  flowforge-postgres-data:
  flowforge-rabbitmq-data:
  flowforge-redis-data:
  flowforge-prometheus-data:
  flowforge-grafana-data: