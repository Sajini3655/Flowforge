apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: flowforge
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api-service
    app.kubernetes.io/part-of: flowforge-platform
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: backend
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: flowforge
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api-service
    app.kubernetes.io/part-of: flowforge-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: flowforge-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: flowforge-config
            - secretRef:
                name: flowforge-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: jwt-keys
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: flowforge-secrets
            items:
              - key: flowforge-private.pem
                path: flowforge-private.pem
              - key: flowforge-public.pem
                path: flowforge-public.pem
